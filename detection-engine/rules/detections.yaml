rules:
- rule_id: AUTH-001
  name: Repeated admin login failure
  description: At least five failed admin logins from one source IP within ten minutes; indicates a brute-force pattern, not proof of compromise.
  category: authentication
  enabled: true
  severity: medium
  log_types: [event|system]
  conditions:
  - {field: action, op: eq, value: login}
  - {field: status, op: eq, value: failed}
  - {field: user, op: eq, value: admin}
  aggregation: {key: srcip, threshold: 5, window_seconds: 600}
  evidence_fields: [srcip, user, status, reason, msg]
  confidence: null
  mitre_techniques: [T1110]
  references: [https://attack.mitre.org/techniques/T1110/]
  tags: [auth]
- rule_id: IPS-001
  name: Medium-severity IPS signature
  category: intrusion_prevention
  enabled: true
  severity: medium
  log_types: [utm|ips]
  conditions:
  - {field: action, op: in, value: [dropped, blocked, detected]}
  - {field: severity, op: eq, value: medium}
  evidence_fields: [srcip, dstip, attack, severity, action]
  description: Medium-severity IPS signature event
  confidence: null
  mitre_techniques: []
  tags: [ips]
- rule_id: IPS-002
  name: High-severity IPS signature
